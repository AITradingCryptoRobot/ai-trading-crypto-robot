services:
  - type: web
    name: ai-trading-crypto-robot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: atr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: aitradingcryptorobot@gmail.com
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: JWT_SECRET
        generateValue: true
